[project]
name = "vision"
version = "0.1.3"
description = "Vision — a local-first desktop AI assistant (OpenAI-compatible providers + MCP tools)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "keyring>=25.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.1.10",
]

[project.scripts]
vision-server = "vision.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mcp>=1.9",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
