name: Release

# Push a tag like v0.1.1 and this builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of Vision check that release and update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match the app version
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match desktop/package.json version $v. Use scripts/bump_version.py."
            exit 1
          }
      - run: uv sync
      - run: npm ci
        working-directory: desktop
      - name: Build and publish the installer
        run: uv run python scripts/build_installer.py --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
